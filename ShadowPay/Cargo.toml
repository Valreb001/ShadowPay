[package]
name = "shadow_pay"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.0"

[dev-dependencies]
soroban-sdk = { version = "21.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
